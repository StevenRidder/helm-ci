# Web-client test suite (CLIENT epic · CLIENT-17).
# Runs `node web/test/run.mjs` — the dependency-free aggregator over every web/ JS test
# (persist, alarms, true-wind, wx-value-codec, ais-risk, ais-guard). No build step, no engine.
name: web-tests

on:
  # Called by verify.yml on the CI sandbox's trusted default branch. source_ref is
  # the disposable refs/tags/ci/** tag holding the exact canonical SHA under test;
  # it is empty for push/pull_request, where checkout falls back to the event ref.
  workflow_call:
    inputs:
      source_ref:
        description: "Exact ref to check out; empty means the triggering ref"
        required: false
        type: string
        default: ""
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run web test suite
        run: node web/test/run.mjs
