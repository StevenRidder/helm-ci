# Web-client E2E (CLIENT epic) — Playwright drives the real app in headless Chromium (SIM mode, no
# engine) and asserts the Tier-1 behaviours hold. Heavier than the dependency-free unit job
# (web-tests.yml), so it's a separate workflow that installs a browser.
name: web-e2e

on:
  # Called by verify.yml on the CI sandbox's trusted default branch. source_ref is
  # the disposable refs/tags/ci/** tag holding the exact canonical SHA under test;
  # it is empty for push/pull_request, where checkout falls back to the event ref.
  workflow_call:
    inputs:
      source_ref:
        description: "Exact ref to check out; empty means the triggering ref"
        required: false
        type: string
        default: ""
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test deps
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E (serves web/ via serve.py in SIM mode)
        run: npx playwright test
      - name: Run OFFLINE-20 sat-first Fiji proof (QA-L-1)
        env:
          HELM_OFFLINE20: '1'
          HELM_OFFLINE20_MOCK_PACKD: '1'
        run: npx playwright test e2e/offline20-sat-first-fiji.spec.js
      - name: Run QA-L-2 depth-on-sat Fiji proof
        env:
          HELM_QAL2: '1'
          HELM_OFFLINE20_MOCK_PACKD: '1'
        run: npx playwright test e2e/qa-l2-depth-on-sat-fiji-st-marys.spec.js --config=playwright.qa-l2.config.js --grep Fiji
